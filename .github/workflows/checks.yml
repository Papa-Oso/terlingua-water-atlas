name: Validate data and public files

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check public file boundaries and catalog
        run: python3 scripts/check_repository.py
      - name: Audit groundwater snapshot
        run: python3 groundwater-map/scripts/audit_snapshot.py
      - name: Check published API snapshot and source references
        run: python3 scripts/build_api.py --check
      - name: Check JavaScript syntax
        run: |
          node --check groundwater-map/dist/app.js
          node --check groundwater-map/dist/areas.js
      - name: Preview source retrieval without network requests
        run: python3 scripts/download_sources.py --group State --limit 2
